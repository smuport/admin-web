<ng-container *ngTemplateOutlet="headRight"></ng-container>
<ng-template #headRight>
  <div id="tools" class="bst-header-wrap">
    <!-- 左侧导航元素 -->
    <div class="left-nav-elements">
      <span
        nz-icon
        nzType="home"
        nzTheme="outline"
        class="main-layout-home-icon"
        (click)="goHome()"
      ></span>
      <span
        nz-icon
        nzType="arrow-left"
        nzTheme="outline"
        class="main-layout-back-icon"
        (click)="onBack()"
      ></span>
      <span class="back-title">返回上一页</span>
    </div>

    <!-- 右侧用户菜单 -->
    <span
      class="bst-header-icon"
      nz-dropdown
      [nzDropdownMenu]="userSettingMenu"
    >
      <img class="avatar" alt="" src="assets/images/default_face.png" />
      <span class="base-font-size">{{ userName }}</span>
    </span>
    <nz-dropdown-menu #userSettingMenu>
      <ul nz-menu>
        <!-- <li nz-menu-item (click)="changePassWorld()">
          <i class="m-r-8" nz-icon nzTheme="outline" nzType="lock"></i>
          <span>修改密码</span>
        </li>
        <li nz-menu-divider></li> -->
        <!-- <li nz-menu-item (click)="clean()">
          <i class="m-r-8" nz-icon nzTheme="outline" nzType="clear"></i>
          <span>清除缓存</span>
        </li> -->
        <!-- <li nz-menu-item (click)="lockScreen()">
          <i class="m-r-8" nz-icon nzTheme="outline" nzType="lock"></i>
          <span>锁定屏幕</span>
        </li> -->
        <li nz-menu-item>
          <div (click)="goLogin()">
            <i class="m-r-8" nz-icon nzTheme="outline" nzType="logout"></i>
            <span>退出登录</span>
          </div>
        </li>
      </ul>
    </nz-dropdown-menu>
  </div>
</ng-template>
