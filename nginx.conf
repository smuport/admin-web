# Nginx 主配置文件
# 用户和组配置
user nginx;

# 工作进程数，通常设置为CPU核心数
worker_processes auto;

# 错误日志路径和级别
error_log /var/log/nginx/error.log warn;

# 进程ID文件路径
pid /var/run/nginx.pid;

# 事件配置块
events {
    # 每个工作进程的最大连接数
    worker_connections 1024;
    
    # 使用epoll事件模型（Linux系统推荐）
    use epoll;
    
    # 允许一个工作进程同时接受多个新连接
    multi_accept on;
}

# HTTP配置块
http {
    # 包含MIME类型定义
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式定义
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # 访问日志配置
    access_log /var/log/nginx/access.log main;

    # 性能优化配置
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # 隐藏Nginx版本信息
    server_tokens off;

    # 客户端请求体大小限制
    client_max_body_size 20M;
    client_body_buffer_size 128k;

    # 开启gzip压缩功能
    gzip on;
    
    # 设置触发gzip压缩的最小文件大小为1kB
    gzip_min_length 1k;
    
    # 设置gzip压缩时使用的缓冲区大小和数量
    gzip_buffers 4 16k;
    
    # 设置gzip压缩级别为6（1最快，9最佳压缩）
    gzip_comp_level 6;
    
    # 定义哪些类型的响应可以被压缩
    gzip_types text/plain application/javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png application/json;
    
    # 关闭gzip的Vary头（影响代理缓存）
    gzip_vary off;
    
    # 禁用针对旧版本IE浏览器的gzip压缩
    gzip_disable "MSIE [1-6]\.";

    # 安全头配置
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # 配置一个监听80端口的服务器
    server {
        listen 80;
        server_name localhost;
        
        # 网站根目录
        root /usr/share/nginx/html;
        index index.html index.htm;

        # 主目录位置配置
        location / {
            # 设置HTTP缓存控制头，缓存时间为3600秒
            add_header Cache-Control "public, max-age=3600";
            
            # 尝试传递请求到文件，如果文件或目录不存在则返回index.html（适用于SPA应用）
            try_files $uri $uri/ /index.html;
        }

        # 静态资源缓存配置
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary Accept-Encoding;
        }

        # API代理配置示例（如果需要代理后端API）
        # location /api/ {
        #     proxy_pass http://backend-server;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }

        # 健康检查端点
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # 定义处理404错误的位置
        location /404 {
            return 404;
        }

        # 错误页面配置
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # 包含其他配置文件
    include /etc/nginx/conf.d/*.conf;
}